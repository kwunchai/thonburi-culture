[build]
buildCommand = "php -r \"file_exists('.env') || copy('.env.example', '.env');\" && composer install --optimize-autoloader --no-dev && php artisan key:generate --ansi"

[deploy]
startCommand = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production.variables]
APP_ENV = "production"
APP_DEBUG = "false"
DB_CONNECTION = "mysql"